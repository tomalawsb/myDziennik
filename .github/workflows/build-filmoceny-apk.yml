name: Build FilmOceny 1.1 APK

on:
  push:
    branches:
      - filmoceny-apk-build-20261002

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore and patch FilmOceny 1.1 sources
        shell: bash
        run: |
          set -euxo pipefail
          cat .filmoceny-build-v110/chunk00               .filmoceny-build-v110/chunk01               .filmoceny-build-v110/chunk02               .filmoceny-build-v110/chunk03               .filmoceny-build-v110/chunk04               .filmoceny-build-v110/chunk05               | base64 --decode > /tmp/FilmOceny-1.1.0.zip
          unzip -t /tmp/FilmOceny-1.1.0.zip
          rm -rf /tmp/filmoceny-src
          mkdir -p /tmp/filmoceny-src
          unzip -q /tmp/FilmOceny-1.1.0.zip -d /tmp/filmoceny-src
          sed -i '/import androidx.compose.foundation.layout.weight/d'             /tmp/filmoceny-src/FilmOceny/app/src/main/java/pl/tomasz/filmoceny/MainActivity.kt
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > /tmp/filmoceny-src/FilmOceny/local.properties

      - name: Build debug APK
        working-directory: /tmp/filmoceny-src/FilmOceny
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=/tmp/filmoceny-src/FilmOceny/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          mkdir -p artifact
          cp "$APK" artifact/FilmOceny-1.1.0.apk
          sha256sum artifact/FilmOceny-1.1.0.apk | tee artifact/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmOceny-1.1.0-APK
          path: artifact
          if-no-files-found: error
