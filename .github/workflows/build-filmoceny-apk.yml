name: Probe FilmOceny portals

on:
  push:
    branches:
      - filmoceny-apk-build-20261002

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public HTML
        run: |
          python3 - <<'PY'
          import re, urllib.parse, urllib.request
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          urls={
            'filmweb':'https://www.filmweb.pl/search?q='+urllib.parse.quote('matrix'),
            'imdb':'https://www.imdb.com/find/?q='+urllib.parse.quote('matrix')+'&s=tt',
            'rt':'https://www.rottentomatoes.com/search?search='+urllib.parse.quote('matrix'),
            'letterboxd':'https://letterboxd.com/search/'+urllib.parse.quote('matrix')+'/',
            'metacritic':'https://www.metacritic.com/search/matrix/'
          }
          for name,url in urls.items():
            print('\n###',name,url)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Language':'pl-PL,pl;q=0.9,en-US;q=0.8,en;q=0.7','Accept':'text/html,application/xhtml+xml'})
              with urllib.request.urlopen(req,timeout=25) as r:
                html=r.read().decode('utf-8','ignore')
              print('LEN',len(html),'FINAL',r.url)
              patterns={
                'filmweb':r'href="([^"]*(?:/film/|/serial/)[^"]+)"',
                'imdb':r'href="([^"]*/title/tt\d+/[^"]*)"',
                'rt':r'href="([^"]*/m/[^"]+)"',
                'letterboxd':r'href="([^"]*/film/[^"]+)"',
                'metacritic':r'href="([^"]*/movie/[^"]+)"',
              }
              found=[]
              for m in re.finditer(patterns[name],html,re.I):
                h=m.group(1)
                if h not in found: found.append(h)
                if len(found)>=12: break
              print('LINKS',found)
              for marker in ['application/ld+json','__NEXT_DATA__','score','rating','search']:
                print(marker, html.lower().find(marker.lower()))
            except Exception as e:
              print('ERR',repr(e))
          PY
