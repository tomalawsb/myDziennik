name: Build FilmOceny APK

on:
  push:
    branches:
      - filmoceny-apk-build-20261002

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore FilmOceny sources
        run: |
          set -euxo pipefail
          cat .filmoceny-build/chunk00 .filmoceny-build/chunk01 .filmoceny-build/chunk02 .filmoceny-build/chunk03 .filmoceny-build/chunk04 | base64 --decode > /tmp/FilmOceny.zip
          unzip -t /tmp/FilmOceny.zip
          rm -rf /tmp/filmoceny-src
          mkdir -p /tmp/filmoceny-src
          unzip -q /tmp/FilmOceny.zip -d /tmp/filmoceny-src
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > /tmp/filmoceny-src/FilmOceny/local.properties

      - name: Build debug APK
        working-directory: /tmp/filmoceny-src/FilmOceny
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -euxo pipefail
          mkdir -p artifact
          cp /tmp/filmoceny-src/FilmOceny/app/build/outputs/apk/debug/app-debug.apk artifact/FilmOceny-1.0.0.apk
          sha256sum artifact/FilmOceny-1.0.0.apk | tee artifact/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmOceny-1.0.0-APK
          path: artifact
          if-no-files-found: error
