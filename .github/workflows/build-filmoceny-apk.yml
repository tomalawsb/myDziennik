name: Probe FilmOceny portals

on:
  push:
    branches:
      - filmoceny-apk-build-20261002

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Filmweb web API and public pages
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, re
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          def get(url, json_mode=False):
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Language':'pl-PL,pl;q=0.9,en;q=0.8','x-locale':'pl','Accept':'application/json,text/html;q=0.9,*/*;q=0.8'})
            with urllib.request.urlopen(req,timeout=25) as r:
              b=r.read()
              return r.status,r.url,b.decode('utf-8','ignore')
          tests=[
            'https://www.filmweb.pl/api/v1/live/search?query=matrix',
            'https://www.filmweb.pl/api/v1/title/628/info',
            'https://www.filmweb.pl/api/v1/film/628/preview',
            'https://www.filmweb.pl/api/v1/film/628/rating',
            'https://www.filmweb.pl/api/v1/film/628/critics/rating',
          ]
          for url in tests:
            print('\n###',url)
            try:
              code,final,txt=get(url)
              print('STATUS',code,'LEN',len(txt))
              try:
                obj=json.loads(txt)
                print(json.dumps(obj,ensure_ascii=False)[:10000])
              except Exception:
                print(txt[:3000])
            except Exception as e: print('ERR',repr(e))
          # Inspect search HTML around "Matrix" for Filmweb/Letterboxd
          for name,url in [
            ('filmweb','https://www.filmweb.pl/search?q=matrix'),
            ('letterboxd','https://letterboxd.com/search/matrix/'),
            ('metacritic','https://www.metacritic.com/search/matrix/'),
          ]:
            print('\n### HTML',name)
            try:
              _,_,html=get(url)
              for needle in ['Matrix','matrix','The Matrix']:
                p=html.find(needle)
                if p>=0:
                  print('SNIP',needle,html[max(0,p-1200):p+3500].replace('\n',' ')[:4700])
                  break
            except Exception as e: print('ERR',repr(e))
          PY
